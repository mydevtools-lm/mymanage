# A tag v1.2.3 builds the Windows installer and opens a draft release with it.
# Publishing stays a manual step (DESKTOP.md section 7).
#
# Updates (DESKTOP.md 6.3): with the repository variable UPDATER_PUBKEY and the
# secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD, the
# build carries the updater's settings, signs the update and attaches
# latest.json, which installed copies read from releases/latest. Without them
# the release is the same installer, minus updating itself.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Updater settings
        id: updater
        if: ${{ vars.UPDATER_PUBKEY != '' }}
        shell: pwsh
        env:
          PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          @{
            bundle  = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{
              pubkey    = $env:PUBKEY
              endpoints = @($env:ENDPOINT)
              windows   = @{ installMode = "passive" }
            } }
          } | ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.updater.conf.json -Encoding utf8
          "args=--config src-tauri/tauri.updater.conf.json" >> $env:GITHUB_OUTPUT
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ steps.updater.outputs.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: "mymanage ${{ github.ref_name }}"
          releaseBody: "What's new: see CHANGELOG.md. To install, download the setup.exe and run it. mymanage-mcp.mjs is the optional MCP server (README)."
          releaseDraft: true
          prerelease: false
      # The read-only MCP server (DESKTOP.md ד9) rides along as one file.
      - name: Attach the MCP server
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          npm run build:mcp
          gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=mymanage-mcp.mjs" --input mcp/dist/mymanage-mcp.mjs
