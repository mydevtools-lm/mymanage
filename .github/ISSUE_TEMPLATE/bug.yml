name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what actually happened. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings › About in the app, or Windows Settings › Apps next to "mymanage", or the installer's file name
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11 23H2
  - type: input
    id: language
    attributes:
      label: Interface language
      placeholder: English / Hebrew
  - type: markdown
    attributes:
      value: "**Don't attach** database files, backups, calendar addresses or keys — they're private. Report security problems as described in SECURITY.md."
