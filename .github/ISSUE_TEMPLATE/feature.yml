name: Feature request
description: An idea for an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What's missing
      description: What you wanted to do and couldn't, or what's awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggestion
      description: How it could work. Optional.
